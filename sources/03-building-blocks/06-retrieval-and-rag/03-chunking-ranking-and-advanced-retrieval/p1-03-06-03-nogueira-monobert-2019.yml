claims_supported:
- Cross-encoder neural rerankers jointly attend over query and candidate text tokens
  to capture deep cross-attention interactions, outperforming bi-encoder first-stage
  retrieval.
limitations:
- Joint cross-attention is computationally expensive and cannot be precomputed into
  vector indices, limiting reranking to a small top-K candidate set.
