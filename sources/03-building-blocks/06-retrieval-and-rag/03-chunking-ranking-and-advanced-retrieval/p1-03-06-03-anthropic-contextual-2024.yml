claims_supported:
- Prepending chunk-specific explanatory context before embedding and indexing reduces
  context loss and retrieval failure rates by preserving global document background
  within isolated passages.
limitations:
- Generating contextual descriptions for every chunk adds upfront token usage during
  ingestion and slightly increases chunk token length.
