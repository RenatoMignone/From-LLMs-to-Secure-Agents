claims_supported:
- GraphRAG extracts entity-relationship graphs and community summaries to support
  global sensemaking queries that span entire document collections, overcoming passage-level
  retrieval limitations.
limitations:
- Graph construction and community detection require substantial LLM inference during
  indexing and can introduce hallucinated relationships if entities are misidentified.
