claims_supported:
- BM25 weights terms using inverse document frequency and saturated term frequency
  normalized by document length, providing an exact-match lexical baseline for inverted
  index search.
limitations:
- BM25 fails on semantic mismatch, synonyms, and paraphrasing where query words do
  not match document tokens literally.
