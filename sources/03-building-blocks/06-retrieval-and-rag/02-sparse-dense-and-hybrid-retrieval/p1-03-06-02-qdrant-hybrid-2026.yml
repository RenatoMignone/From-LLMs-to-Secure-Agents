claims_supported:
- Hybrid retrieval merges candidate rankings from sparse lexical and dense embedding
  retrievers using Reciprocal Rank Fusion or score distribution normalization, combining
  keyword precision with semantic recall.
limitations:
- Running dual retrievers doubles index storage and adds query overhead, and fusion
  cannot recover relevant items excluded by both prefetch cutoffs.
