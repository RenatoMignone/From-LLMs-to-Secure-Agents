claims_supported:
- Dense retrieval uses dual-encoders to map queries and passages into a shared vector
  space, capturing semantic similarity and outperforming sparse BM25 on general questions.
limitations:
- Dense retrieval can fail on exact lexical matches, unusual codes, product identifiers,
  and rare terms not well represented in training data.
