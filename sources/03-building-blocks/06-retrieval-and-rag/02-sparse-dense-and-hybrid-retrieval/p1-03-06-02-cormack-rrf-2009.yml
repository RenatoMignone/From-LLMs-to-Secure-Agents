claims_supported:
- Reciprocal Rank Fusion (RRF) scores documents across multiple ranked result lists
  by summing 1 / (k + rank), providing effective rank combination without score calibration
  or parameter tuning.
limitations:
- RRF uses only rank positions, ignoring the actual score distances or relative margin
  of confidence between adjacent candidates.
