claims_supported:
- Designs in-context working memory as an OS-like virtual context divided into fixed system instructions, editable working scratchpads (core memory), and a FIFO message queue that triggers eviction and consolidation routines when token thresholds are exceeded.
limitations:
- Requires active LLM function calling to edit working memory scratchpads, which adds per-step token overhead and latency.
