claims_supported:
- AutoGen supports immediate feedback through UserProxyAgent and feedback between
  stopped runs with state persistence; HandoffTermination can transfer control.
limitations:
- An in-run UserProxyAgent blocks the team and is intended for short interactions,
  unlike a durable external approval queue.
