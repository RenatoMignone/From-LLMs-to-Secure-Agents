claims_supported:
- CloudEvents defines an occurrence as a captured statement of fact during software
  operation and an event as a data record expressing that occurrence and its context.
limitations:
- CloudEvents standardizes an event format, not application-specific event meaning,
  persistence, authorization, or delivery guarantees.
