claims_supported:
- Defines delegation semantics where an actor acts on behalf of a subject while keeping
  their identities distinct, and specifies token structures to represent delegation
  chains.
limitations:
- Token exchange defines identity and authority structures in token envelopes, not
  internal agent reasoning or safety policies.
